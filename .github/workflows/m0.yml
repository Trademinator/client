name: M0 runtime validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        php: ['8.3', '8.4', '8.5']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, gmp, mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer validate --strict
      - run: composer lint
      - run: composer test
      - run: composer doctor
      - run: php tools/soak.php 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0-${{ matrix.os }}-php${{ matrix.php }}
          path: build/soak-*/report.json
